name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: 17

      - name: Sonar - inicio
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"sampaiobrenner_${{ github.event.repository.name }}" \
            /o:"sampaiobrenner" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/*/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx" \
            /d:sonar.coverage.exclusions="**/Migrations/**,test/**"

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - name: Testes com cobertura
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage;Format=opencover"

      - name: Sonar - fim
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/**

  docker:
    name: docker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t fcg-payments-api:${{ github.sha }} .

  publish:
    name: publish
    if: github.event_name != 'pull_request'
    needs: build-test
    uses: sampaiobrenner/fcg-orchestration/.github/workflows/docker-publish.yml@main
    with:
      image-name: fcg-payments-api
    permissions:
      contents: read
      packages: write
